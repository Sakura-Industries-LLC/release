# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: release-cli

gomod:
  proxy: true
  env:
    - GOTOOLCHAIN=local
    - GOPROXY=https://proxy.golang.org,direct
    - GOSUMDB=sum.golang.org

builds:
  - id: release-cli
    main: ./cmd/release-cli
    binary: release-cli
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

notarize:
  macos:
    - enabled: '{{ eq .Env.MACOS_NOTARIZE_ENABLED "true" }}'
      ids:
        - release-cli
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: release-cli
    ids:
      - release-cli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: release
    ids:
      - release-cli
    vendor: Meigma
    homepage: https://github.com/meigma/release
    maintainer: Meigma <contact@meigma.dev>
    description: Exercise the Meigma release pipeline.
    license: LicenseRef-Proprietary
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    rpm:
      signature:
        key_file: "{{ .Env.RELEASE_RPM_SIGNING_KEY_FILE }}"
    apk:
      signature:
        key_file: "{{ .Env.RELEASE_APK_SIGNING_KEY_FILE }}"
        key_name: meigma-release-001

homebrew_casks:
  - name: meigma-release-cli
    ids:
      - release-cli
    binaries:
      - release-cli
    repository:
      owner: meigma
      name: homebrew-tap
    homepage: https://github.com/meigma/release
    description: Release automation for Meigma projects
    license: LicenseRef-Proprietary
    url:
      template: "https://github.com/meigma/release/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    skip_upload: true

scoops:
  - name: meigma-release-cli
    ids:
      - release-cli
    repository:
      owner: meigma
      name: scoop-bucket
    homepage: https://github.com/meigma/release
    description: Release automation for Meigma projects
    license: Proprietary
    url_template: "https://github.com/meigma/release/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    skip_upload: true

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  disable: true

release:
  disable: true

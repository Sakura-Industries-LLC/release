contents:
  repositories:
    - https://dl-cdn.alpinelinux.org/alpine/v3.24/main
  packages:
    - alpine-release
    - ca-certificates-bundle
    - release-mvp

entrypoint:
  command: /usr/bin/release-mvp

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: nonroot

environment:
  PATH: /usr/bin
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.title: release-mvp
  org.opencontainers.image.description: Exercise the Meigma release pipeline.
  org.opencontainers.image.source: https://github.com/meigma/release
  org.opencontainers.image.licenses: LicenseRef-Proprietary

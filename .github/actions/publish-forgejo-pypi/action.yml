name: Publish Python distributions to Forgejo
description: >
  Uploads the two Python distributions of a verified release bundle to a
  Forgejo PyPI package registry, or checks the distribution set without
  uploading.

inputs:
  dist:
    description: Verified distribution directory holding the closed release bundle.
    required: false
    default: dist
  package-name:
    description: PEP 503 normalized distribution name both files must carry.
    required: true
  expected-version:
    description: Version this release publishes. Required when publish is true; both distributions must name it.
    required: false
    default: ''
  origin:
    description: HTTPS origin of the forge, for example `https://forge.dntls.net`.
    required: true
  owner:
    description: Registry owner that holds the packages.
    required: true
  publisher-username:
    description: Forge account the publisher token belongs to.
    required: true
  publish:
    description: Upload the distributions. When false the action checks the set, reports what it would upload, and sends no upload.
    required: false
    default: 'false'
  publisher-token:
    description: Token of the publisher account. Required only when publish is true; without it the action stops at the set checks.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The one step that reaches the registry, and so the only place the token
    # exists. The script owns the distribution-set and published-state rules
    # too, so an operator rehearsing it by hand runs the checks a publication
    # runs.
    - name: Publish the Python distributions
      shell: bash
      env:
        DIST: ${{ inputs.dist }}
        FORGEJO_ORIGIN: ${{ inputs.origin }}
        FORGEJO_OWNER: ${{ inputs.owner }}
        FORGEJO_PACKAGE: ${{ inputs.package-name }}
        FORGEJO_EXPECTED_VERSION: ${{ inputs.expected-version }}
        FORGEJO_USERNAME: ${{ inputs.publisher-username }}
        FORGEJO_PUBLISH: ${{ inputs.publish }}
        FORGEJO_TOKEN: ${{ inputs.publisher-token }}
      run: bash "${GITHUB_ACTION_PATH}/publish-pypi.sh" "${DIST}"

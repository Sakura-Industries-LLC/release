name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-cli:
    name: Build dogfood release-cli
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: go
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Build release-cli
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "${RUNNER_TEMP}/release-cli-dogfood"
          mise exec -- go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o "${RUNNER_TEMP}/release-cli-dogfood/release-cli" \
            ./cmd/release-cli

      - name: Upload dogfood release-cli
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-dogfood
          path: ${{ runner.temp }}/release-cli-dogfood/release-cli
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release-assets:
    name: Build release assets
    if: github.event.deleted == false
    needs: build-release-cli
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    uses: ./.github/workflows/go-pre-publish.yml
    with:
      cli-path: .release-cli/release-cli
  oci-image:
    name: Build OCI image
    needs: release-assets
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/go-oci-build.yml
    with:
      artifact-id: ${{ needs.release-assets.outputs.oci-input-artifact-id }}
      artifact-digest: ${{ needs.release-assets.outputs.oci-input-artifact-digest }}
      cli-path: .release-cli/release-cli
  oci-publish:
    name: Publish OCI image
    needs: oci-image
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-oci-image.yml
    with:
      artifact-id: ${{ needs.oci-image.outputs.artifact-id }}
      artifact-digest: ${{ needs.oci-image.outputs.artifact-digest }}
      image-digest: ${{ needs.oci-image.outputs.image-digest }}
      publish-image: true
      cli-path: .release-cli/release-cli



  github-release:
    name: Publish GitHub Release
    needs:
      - release-assets
      - oci-image
      - oci-publish
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-github-release.yml
    with:
      artifact-id: ${{ needs.release-assets.outputs.artifact-id }}
      artifact-digest: ${{ needs.release-assets.outputs.artifact-digest }}
      checksum-signing-workflow-ref: ${{ github.repository }}/.github/workflows/go-pre-publish.yml@${{ github.ref }}
      require-oci-image: true
      oci-image-reference: ${{ needs.oci-publish.outputs.image-reference }}
      release-app-client-id: ${{ vars.MEIGMA_RELEASE_APP_CLIENT_ID }}
      publish-release: true
      cli-path: .release-cli/release-cli
    secrets:
      release-app-private-key: ${{ secrets.MEIGMA_RELEASE_APP_PRIVATE_KEY }}

# Exercises the composite's installed acquisition path end to end:
# archive download, checksum verification, gh attestation verify with
# the derived --signer-workflow and --deny-self-hosted-runners, then
# stamp equality.
#
# This cannot pass until a release exists (release-please PR #6,
# chore(main): release 0.1.0, is still open). It is workflow_dispatch
# only and is intentionally not a merge gate.
name: Verify setup-release-cli installed path

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version the installed CLI must report (without a v prefix).
        required: true
        type: string

permissions: {}

jobs:
  verify-installed:
    name: Verify installed release-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          mise_toml: |
            [tools]
            "aqua:cli/cli" = "2.97.0"
          install_args: aqua:cli/cli
          cache: true
          add_shims_to_path: true
          export_path: true

      - name: Set up release-cli
        id: setup-cli
        uses: $/.github/actions/setup-release-cli

      - name: Assert installed version and protocol
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          EXPECTED_VERSION: ${{ inputs.version }}
          COMPOSITE_VERSION: ${{ steps.setup-cli.outputs.reported-version }}
          COMPOSITE_PROTOCOL: ${{ steps.setup-cli.outputs.reported-protocol }}
        shell: bash
        run: |
          set -euo pipefail
          report="$("${RELEASE_CLI}" version --json)"
          printf '%s\n' "${report}"
          reported_version="$(printf '%s' "${report}" | jq -r .result.version)"
          reported_protocol="$(printf '%s' "${report}" | jq -r .result.protocol)"
          if [[ "${reported_version}" != "${EXPECTED_VERSION}" ]]; then
            echo "::error::Installed CLI reported version ${reported_version}, expected ${EXPECTED_VERSION}."
            exit 1
          fi
          if [[ "${reported_protocol}" != "1" ]]; then
            echo "::error::Installed CLI reported protocol ${reported_protocol}, expected 1."
            exit 1
          fi
          if [[ "${reported_version}" != "${COMPOSITE_VERSION}" ]]; then
            echo "::error::version --json does not match the composite reported-version output."
            exit 1
          fi
          if [[ "${reported_protocol}" != "${COMPOSITE_PROTOCOL}" ]]; then
            echo "::error::version --json does not match the composite reported-protocol output."
            exit 1
          fi

name: Reusable Homebrew Publisher

on:
  workflow_call:
    inputs:
      artifact-id:
        description: ID of the authoritative release-assets artifact.
        required: true
        type: string
      artifact-digest:
        description: Expected SHA-256 digest of the release-assets artifact.
        required: true
        type: string
      checksum-signing-workflow-ref:
        description: Exact workflow ref expected in the checksum signing certificate identity.
        required: true
        type: string
      tap:
        description: Homebrew tap repository in owner/name form.
        required: false
        default: ''
        type: string
      cask:
        description: Cask token generated by GoReleaser.
        required: false
        default: ''
        type: string
      release-app-client-id:
        description: Client ID of the GitHub App that writes the tap pull request.
        required: false
        default: ''
        type: string
      publish-homebrew:
        description: Reconcile the generated cask through a tap pull request.
        required: false
        default: false
        type: boolean
    secrets:
      release-app-private-key:
        description: Private key of the GitHub App that writes the tap pull request.
        required: false
    outputs:
      branch:
        description: Deterministic tap publication branch.
        value: ${{ jobs.publish.outputs.branch }}
      pull-request-url:
        description: Open tap pull request URL, when one exists.
        value: ${{ jobs.publish.outputs.pull-request-url }}
      state:
        description: Reconciled publication state.
        value: ${{ jobs.publish.outputs.state }}

permissions: {}

jobs:
  publish:
    name: Publish Homebrew cask
    if: inputs.publish-homebrew
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      branch: ${{ steps.publish.outputs.branch }}
      pull-request-url: ${{ steps.publish.outputs.pull-request-url }}
      state: ${{ steps.publish.outputs.state }}
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Validate publication configuration
        id: config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CASK: ${{ inputs.cask }}
          RELEASE_APP_CLIENT_ID: ${{ inputs.release-app-client-id }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.release-app-private-key }}
          TAP: ${{ inputs.tap }}
        with:
          script: |
            if (context.ref.startsWith('refs/tags/') === false) {
              core.setFailed('Homebrew publication must run against a tag ref.')
              return
            }

            const required = [
              'CASK',
              'RELEASE_APP_CLIENT_ID',
              'RELEASE_APP_PRIVATE_KEY',
              'TAP',
            ]
            const missing = required.filter((name) => !process.env[name])
            if (missing.length !== 0) {
              core.setFailed(`Homebrew publication is enabled but these values are missing: ${missing.join(', ')}`)
              return
            }

            const tap = process.env.TAP.match(/^([a-zA-Z0-9_.-]+)\/([a-zA-Z0-9_.-]+)$/)
            if (!tap) {
              core.setFailed('Homebrew tap must use owner/repository form.')
              return
            }
            if (!/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(process.env.CASK)) {
              core.setFailed('Homebrew cask must contain lowercase letters, digits, and interior hyphens.')
              return
            }

            core.setOutput('tap-owner', tap[1])
            core.setOutput('tap-repository', tap[2])

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: 'aqua:sigstore/cosign'
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Verify publication tools
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: await exec.exec('mise', ['exec', '--', 'cosign', 'version'])

      - name: Set up release-cli
        id: setup-cli
        uses: $/.github/actions/setup-release-cli

      - name: Verify artifact handoff
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_DIGEST: ${{ inputs.artifact-digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
        shell: bash
        run: |
          "${RELEASE_CLI}" verify handoff --artifact-id "${ARTIFACT_ID}" --digest "${EXPECTED_DIGEST}"

      - name: Download authoritative release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: dist
          digest-mismatch: error

      - name: Isolate generated cask control
        id: isolate-cask
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CASK: ${{ inputs.cask }}
        with:
          script: |
            const fs = require('fs/promises')
            const path = require('path')
            const homebrew = path.resolve('dist/homebrew')
            const casks = path.join(homebrew, 'Casks')
            const control = path.join(process.env.RUNNER_TEMP, 'homebrew-control')

            const homebrewEntries = await fs.readdir(homebrew, {withFileTypes: true})
            if (homebrewEntries.length !== 1 || homebrewEntries[0].name !== 'Casks' || !homebrewEntries[0].isDirectory()) {
              throw new Error('The release artifact must contain only homebrew/Casks beneath homebrew/.')
            }

            const caskEntries = await fs.readdir(casks, {withFileTypes: true})
            const expected = `${process.env.CASK}.rb`
            if (caskEntries.length !== 1 || caskEntries[0].name !== expected || !caskEntries[0].isFile()) {
              throw new Error(`The release artifact must contain exactly homebrew/Casks/${expected}.`)
            }

            await fs.rm(control, {recursive: true, force: true})
            await fs.rename(homebrew, control)
            core.setOutput('control', control)

      - name: Verify authoritative release bundle
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ inputs.checksum-signing-workflow-ref }}
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
        shell: bash
        run: |
          set -euo pipefail
          cosign_path="$(mise which cosign)"
          if [ ! -x "${cosign_path}" ]; then
            echo "::error::Resolved cosign path ${cosign_path} is not executable."
            exit 1
          fi

          RELEASE_COSIGN_PATH="${cosign_path}" \
            "${RELEASE_CLI}" verify bundle \
            --dist dist \
            --identity "${CERTIFICATE_IDENTITY}" \
            --json

      - name: Restore generated cask control
        env:
          CONTROL: ${{ steps.isolate-cask.outputs.control }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs/promises')
            const path = require('path')
            await fs.rename(process.env.CONTROL, path.resolve('dist/homebrew'))

      - name: Create tap app token
        id: tap-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.release-app-client-id }}
          private-key: ${{ secrets.release-app-private-key }}
          owner: ${{ steps.config.outputs.tap-owner }}
          repositories: ${{ steps.config.outputs.tap-repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: Publish generated Homebrew cask
        id: publish
        env:
          CASK: ${{ inputs.cask }}
          RELEASE_APP_TOKEN: ${{ steps.tap-app.outputs.token }}
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          TAP: ${{ inputs.tap }}
        shell: bash
        run: |
          set -euo pipefail
          envelope="$(
            "${RELEASE_CLI}" publish homebrew \
              --dist dist \
              --tap "${TAP}" \
              --cask "${CASK}" \
              --json
          )"
          printf '%s\n' "${envelope}"

          state="$(jq -r '.result.state' <<<"${envelope}")"
          branch="$(jq -r '.result.branch' <<<"${envelope}")"
          url="$(jq -r '.result.pull_request_url // ""' <<<"${envelope}")"
          case "${state}" in
            created|open)
              if [ -z "${url}" ]; then
                echo "::error::Homebrew publication reported ${state} without a pull request URL."
                exit 1
              fi
              ;;
            published)
              ;;
            *)
              echo "::error::Homebrew publication reported unexpected state ${state}."
              exit 1
              ;;
          esac
          if [ -z "${branch}" ] || [ "${branch}" = 'null' ]; then
            echo '::error::Homebrew publication reported no branch.'
            exit 1
          fi

          printf 'branch=%s\n' "${branch}" >>"${GITHUB_OUTPUT}"
          printf 'pull-request-url=%s\n' "${url}" >>"${GITHUB_OUTPUT}"
          printf 'state=%s\n' "${state}" >>"${GITHUB_OUTPUT}"

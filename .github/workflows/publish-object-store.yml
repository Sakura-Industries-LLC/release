name: Reusable Object Store Publisher

on:
  workflow_call:
    inputs:
      artifact-id:
        description: ID of the authoritative release-assets artifact.
        required: true
        type: string
      artifact-digest:
        description: Expected SHA-256 digest of the release-assets artifact.
        required: true
        type: string
      checksum-signing-workflow-ref:
        description: Exact workflow ref expected in the checksum signing certificate identity.
        required: true
        type: string
      project:
        description: First key segment under which this release's files are stored, for example `dntls`.
        required: true
        type: string
      endpoint:
        description: S3 API origin of the private release bucket, for example `https://objects.dntls.net`.
        required: true
        type: string
      bucket:
        description: Private release bucket name.
        required: true
        type: string
      region:
        description: Signing region the endpoint expects (`garage` for Garage).
        required: true
        type: string
      publish-object-store:
        description: Upload the verified bundle. When false the job verifies the handoff and bundle and uploads nothing.
        required: false
        default: false
        type: boolean

    secrets:
      object-store-access-key-id:
        description: Access key ID with write permission on the bucket.
        required: true
      object-store-secret-access-key:
        description: Secret for the access key.
        required: true
    outputs:
      prefix:
        description: Bucket key prefix (`<project>/<tag>`) the release was published under.
        value: ${{ jobs.publish.outputs.prefix }}
      state:
        description: '`published` when at least one object was uploaded, `unchanged` when every object already matched, `skipped` when publication was disabled.'
        value: ${{ jobs.publish.outputs.state }}

permissions: {}

jobs:
  publish:
    name: Publish to object store
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      prefix: ${{ steps.publish.outputs.prefix }}
      state: ${{ steps.publish.outputs.state || 'skipped' }}
    permissions:
      actions: read
      contents: read
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Require a tag ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (process.env.GITHUB_REF_TYPE !== 'tag') {
              throw new Error('Object store publication must run against a tag ref.')
            }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Require the tag to point at this commit
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} resolves to ${tag_commit}, expected ${GITHUB_SHA}."
            exit 1
          fi

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: 'aqua:sigstore/cosign'
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Verify publication tools
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await exec.exec('mise', ['exec', '--', 'cosign', 'version'])

      - name: Set up release-cli
        id: setup-cli
        uses: $/.github/actions/setup-release-cli

      - name: Verify artifact handoff
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_DIGEST: ${{ inputs.artifact-digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          "${RELEASE_CLI}" verify handoff --artifact-id "${ARTIFACT_ID}" --digest "${EXPECTED_DIGEST}"

      - name: Download authoritative release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: dist
          digest-mismatch: error

      - name: Exclude package-manager controls from the object store
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs/promises')
            const path = require('path')
            await fs.rm(path.resolve('dist/homebrew'), {recursive: true, force: true})
            await fs.rm(path.resolve('dist/scoop'), {recursive: true, force: true})

      - name: Verify authoritative release bundle
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ inputs.checksum-signing-workflow-ref }}
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
        shell: bash
        run: |
          set -euo pipefail
          # mise runs here without shims and without exporting PATH, so hand the
          # CLI the pinned cosign binary instead of putting it on PATH globally.
          cosign_path="$(mise which cosign)"
          if [ ! -x "${cosign_path}" ]; then
            echo "::error::Resolved cosign path ${cosign_path} is not executable."
            exit 1
          fi

          RELEASE_COSIGN_PATH="${cosign_path}" \
            "${RELEASE_CLI}" verify bundle \
            --dist dist \
            --identity "${CERTIFICATE_IDENTITY}" \
            --json

      - name: Publish verified bundle to the object store
        id: publish
        if: inputs.publish-object-store
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          RELEASE_OBJECT_STORE_PROJECT: ${{ inputs.project }}
          RELEASE_OBJECT_STORE_ENDPOINT: ${{ inputs.endpoint }}
          RELEASE_OBJECT_STORE_BUCKET: ${{ inputs.bucket }}
          RELEASE_OBJECT_STORE_REGION: ${{ inputs.region }}
          OBJECT_STORE_ACCESS_KEY_ID: ${{ secrets.object-store-access-key-id }}
          OBJECT_STORE_SECRET_ACCESS_KEY: ${{ secrets.object-store-secret-access-key }}
        shell: bash
        run: |
          set -euo pipefail
          # The CLI rebuilds the closed set from checksums.txt, uploads only
          # objects that are absent, and refuses to overwrite a differing one.
          envelope="$("${RELEASE_CLI}" publish object-store --dist dist --json)"
          printf '%s\n' "${envelope}"

          prefix="$(jq -r '.result.prefix' <<<"${envelope}")"
          state="$(jq -r '.result.state' <<<"${envelope}")"
          if [ -z "${prefix}" ] || [ "${prefix}" = 'null' ] || [ -z "${state}" ] || [ "${state}" = 'null' ]; then
            echo '::error::Object store publication reported no prefix or state.'
            exit 1
          fi
          printf 'prefix=%s\n' "${prefix}" >>"${GITHUB_OUTPUT}"
          printf 'state=%s\n' "${state}" >>"${GITHUB_OUTPUT}"

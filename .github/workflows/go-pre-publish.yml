name: Reusable Go Pre-publish

on:
  workflow_call:
    inputs:
      sign-and-notarize-macos:
        description: Sign and notarize Darwin binaries before archiving.
        required: false
        default: false
        type: boolean
      sign-native-packages:
        description: Sign RPM and APK packages before checksums are generated.
        required: false
        default: false
        type: boolean
    secrets:
      macos-sign-p12:
        description: Base64-encoded Developer ID Application certificate.
        required: false
      macos-sign-password:
        description: Password for the Developer ID Application certificate.
        required: false
      macos-notary-key:
        description: Base64-encoded App Store Connect API private key.
        required: false
      macos-notary-key-id:
        description: App Store Connect API key ID.
        required: false
      macos-notary-issuer-id:
        description: App Store Connect API issuer ID.
        required: false
      rpm-signing-key:
        description: Base64-encoded OpenPGP private key for RPM packages.
        required: false
      rpm-signing-passphrase:
        description: Passphrase for the RPM package-signing key.
        required: false
      apk-signing-key:
        description: Base64-encoded RSA private key for APK packages.
        required: false
      apk-signing-passphrase:
        description: Passphrase for the APK package-signing key.
        required: false
    outputs:
      artifact-id:
        description: ID of the authoritative release-assets artifact.
        value: ${{ jobs.release-assets.outputs.artifact-id }}
      artifact-url:
        description: URL of the authoritative release-assets artifact.
        value: ${{ jobs.release-assets.outputs.artifact-url }}
      artifact-digest:
        description: SHA-256 digest of the authoritative release-assets artifact.
        value: ${{ jobs.release-assets.outputs.artifact-digest }}
      oci-input-artifact-id:
        description: ID of the canonical Linux binaries artifact.
        value: ${{ jobs.release-assets.outputs.oci-input-artifact-id }}
      oci-input-artifact-url:
        description: URL of the canonical Linux binaries artifact.
        value: ${{ jobs.release-assets.outputs.oci-input-artifact-url }}
      oci-input-artifact-digest:
        description: SHA-256 digest of the canonical Linux binaries artifact.
        value: ${{ jobs.release-assets.outputs.oci-input-artifact-digest }}

permissions: {}

jobs:
  release-assets:
    name: Build authoritative release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      oci-input-artifact-id: ${{ steps.upload-oci-input.outputs.artifact-id }}
      oci-input-artifact-url: ${{ steps.upload-oci-input.outputs.artifact-url }}
      oci-input-artifact-digest: ${{ steps.upload-oci-input.outputs.artifact-digest }}
    permissions:
      attestations: read
      contents: read
      id-token: write
    env:
      GOTOOLCHAIN: local
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Validate macOS signing configuration
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENABLED: ${{ inputs.sign-and-notarize-macos }}
          MACOS_SIGN_P12: ${{ secrets.macos-sign-p12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.macos-sign-password }}
          MACOS_NOTARY_KEY: ${{ secrets.macos-notary-key }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.macos-notary-key-id }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.macos-notary-issuer-id }}
        with:
          script: |
            if (process.env.ENABLED !== 'true') {
              return
            }

            const required = [
              'MACOS_SIGN_P12',
              'MACOS_SIGN_PASSWORD',
              'MACOS_NOTARY_KEY',
              'MACOS_NOTARY_KEY_ID',
              'MACOS_NOTARY_ISSUER_ID',
            ]
            const missing = required.filter((name) => !process.env[name])
            if (missing.length !== 0) {
              core.setFailed(`macOS signing is enabled but these credentials are missing: ${missing.join(', ')}`)
            }

      - name: Validate native package signing configuration
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENABLED: ${{ inputs.sign-native-packages }}
          RPM_SIGNING_KEY: ${{ secrets.rpm-signing-key }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.rpm-signing-passphrase }}
          APK_SIGNING_KEY: ${{ secrets.apk-signing-key }}
          APK_SIGNING_PASSPHRASE: ${{ secrets.apk-signing-passphrase }}
        with:
          script: |
            if (process.env.ENABLED !== 'true') {
              return
            }

            const required = [
              'RPM_SIGNING_KEY',
              'RPM_SIGNING_PASSPHRASE',
              'APK_SIGNING_KEY',
              'APK_SIGNING_PASSPHRASE',
            ]
            const missing = required.filter((name) => !process.env[name])
            if (missing.length !== 0) {
              core.setFailed(`native package signing is enabled but these credentials are missing: ${missing.join(', ')}`)
            }

      - name: Require a tag ref
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo '::error::Go pre-publish must run against a tag ref.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: >-
            go
            aqua:goreleaser/goreleaser
            aqua:anchore/syft
            aqua:sigstore/cosign
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Verify Go release tools
        shell: bash
        run: |
          mise exec -- bash -euo pipefail -c '
            for tool in go goreleaser syft cosign; do
              active=$(command -v "${tool}")
              managed=$(mise which "${tool}")
              test "$(realpath "${active}")" = "$(realpath "${managed}")"
              printf "Using %s: %s\n" "${tool}" "${active}"
            done
            go version
          '

      - name: Set up release-cli
        id: setup-cli
        uses: $/.github/actions/setup-release-cli

      - name: Materialize native package signing keys
        id: native-signing
        if: inputs.sign-native-packages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RPM_SIGNING_KEY: ${{ secrets.rpm-signing-key }}
          APK_SIGNING_KEY: ${{ secrets.apk-signing-key }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const decode = (name) => {
              const encoded = process.env[name].replace(/\s+/g, '')
              const valid = encoded.length !== 0 &&
                encoded.length % 4 === 0 &&
                /^[A-Za-z0-9+/]+={0,2}$/.test(encoded)
              if (!valid) {
                throw new Error(`${name} is not valid base64`)
              }

              const decoded = Buffer.from(encoded, 'base64')
              if (
                decoded.length === 0 ||
                decoded.toString('base64').replace(/=+$/, '') !== encoded.replace(/=+$/, '')
              ) {
                throw new Error(`${name} is not valid base64`)
              }
              return decoded
            }

            const rpmKey = decode('RPM_SIGNING_KEY')
            const apkKey = decode('APK_SIGNING_KEY')
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'release-native-signing-'))
            core.setOutput('directory', directory)
            const rpmKeyFile = path.join(directory, 'rpm-signing-key.asc')
            const apkKeyFile = path.join(directory, 'apk-signing-key.pem')
            fs.writeFileSync(rpmKeyFile, rpmKey, { mode: 0o600, flag: 'wx' })
            fs.writeFileSync(apkKeyFile, apkKey, { mode: 0o600, flag: 'wx' })
            core.setOutput('rpm-key-file', rpmKeyFile)
            core.setOutput('apk-key-file', apkKeyFile)

      - name: Stage Go release artifacts
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          MACOS_NOTARIZE_ENABLED: ${{ inputs.sign-and-notarize-macos }}
          MACOS_SIGN_P12: ${{ secrets.macos-sign-p12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.macos-sign-password }}
          MACOS_NOTARY_KEY: ${{ secrets.macos-notary-key }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.macos-notary-key-id }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.macos-notary-issuer-id }}
          RELEASE_NATIVE_PACKAGE_SIGNING: ${{ inputs.sign-native-packages }}
          RELEASE_RPM_SIGNING_KEY_FILE: ${{ steps.native-signing.outputs.rpm-key-file }}
          RELEASE_APK_SIGNING_KEY_FILE: ${{ steps.native-signing.outputs.apk-key-file }}
          NFPM_RELEASE_RPM_PASSPHRASE: ${{ secrets.rpm-signing-passphrase }}
          NFPM_RELEASE_APK_PASSPHRASE: ${{ secrets.apk-signing-passphrase }}
        shell: bash
        run: |
          set -euo pipefail
          # mise runs here without shims and without exporting PATH, so hand the
          # CLI the pinned goreleaser binary instead of putting it on PATH
          # globally.
          goreleaser_path="$(mise which goreleaser)"
          if [ ! -x "${goreleaser_path}" ]; then
            echo "::error::Resolved goreleaser path ${goreleaser_path} is not executable."
            exit 1
          fi

          # The CLI builds the release bundle and then validates it. GoReleaser
          # shells out to go, syft, and cosign, so the CLI runs under mise exec
          # to give those grandchild processes the managed toolchain.
          RELEASE_GORELEASER_PATH="${goreleaser_path}" \
            mise exec -- "${RELEASE_CLI}" stage --profile go --dist dist

      - name: Remove native package signing keys
        if: ${{ always() && steps.native-signing.outputs.directory != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KEY_DIRECTORY: ${{ steps.native-signing.outputs.directory }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const directory = process.env.KEY_DIRECTORY
            const expectedParent = path.resolve(process.env.RUNNER_TEMP)
            if (
              path.dirname(path.resolve(directory)) !== expectedParent ||
              !path.basename(directory).startsWith('release-native-signing-')
            ) {
              throw new Error('refusing to remove an unexpected signing-key directory')
            }
            fs.rmSync(directory, { recursive: true, force: true })

      - name: Set up Homebrew
        id: homebrew
        if: hashFiles('dist/homebrew/Casks/*.rb') != ''
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          brew-gh-api-token: ''

      - name: Format generated Homebrew casks
        if: steps.homebrew.outcome == 'success'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        shell: bash
        run: |
          set -euo pipefail
          tap='meigma/release-build'
          tap_root=''
          cleanup() {
            if [ -n "${tap_root}" ]; then
              brew untap --force "${tap}" >/dev/null
            fi
          }
          trap cleanup EXIT

          brew tap-new --no-git "${tap}"
          tap_root="$(brew --repository "${tap}")"
          mkdir -p "${tap_root}/Casks"
          cp dist/homebrew/Casks/*.rb "${tap_root}/Casks/"
          brew style --fix --cask "${tap}"
          brew style --cask "${tap}"
          cp "${tap_root}"/Casks/*.rb dist/homebrew/Casks/

      - name: Upload canonical Linux binaries
        id: upload-oci-input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-build-inputs
          path: |
            dist/artifacts.json
            dist/oci-build-inputs.json
            dist/*_linux_amd64*/**
            dist/*_linux_arm64*/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload authoritative release assets
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.sbom.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/homebrew/Casks/*.rb
            dist/scoop/*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

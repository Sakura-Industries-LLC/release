name: Reusable Go OCI Builder

on:
  workflow_call:
    inputs:
      artifact-id:
        description: ID of the canonical Linux binaries artifact.
        required: true
        type: string
      artifact-digest:
        description: Expected SHA-256 digest of the canonical Linux binaries artifact.
        required: true
        type: string
      melange-config:
        description: Path to the consumer's Melange package configuration.
        required: false
        default: melange.yaml
        type: string
      apko-config:
        description: Path to the consumer's apko image configuration.
        required: false
        default: apko.yaml
        type: string

    outputs:
      artifact-id:
        description: ID of the authoritative OCI image artifact.
        value: ${{ jobs.oci-image.outputs.artifact-id }}
      artifact-url:
        description: URL of the authoritative OCI image artifact.
        value: ${{ jobs.oci-image.outputs.artifact-url }}
      artifact-digest:
        description: SHA-256 digest of the authoritative OCI image artifact.
        value: ${{ jobs.oci-image.outputs.artifact-digest }}
      image-digest:
        description: Digest of the OCI image index.
        value: ${{ jobs.oci-image.outputs.image-digest }}

permissions: {}

jobs:
  oci-image:
    name: Build authoritative OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      image-digest: ${{ steps.verify.outputs.image-digest }}
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Require a tag ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (process.env.GITHUB_REF_TYPE !== 'tag') {
              throw new Error('Go OCI production must run against a tag ref.')
            }
            if (!process.env.GITHUB_REF_NAME.startsWith('v')) {
              throw new Error(`Expected a v-prefixed tag, got ${process.env.GITHUB_REF_NAME}.`)
            }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: >-
            aqua:cli/cli
            aqua:chainguard-dev/melange
            aqua:chainguard-dev/apko
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Verify OCI build tools
        shell: bash
        run: |
          mise exec -- bash -euo pipefail -c '
            for tool in gh melange apko; do
              active=$(command -v "${tool}")
              managed=$(mise which "${tool}")
              test "$(realpath "${active}")" = "$(realpath "${managed}")"
              printf "Using %s: %s\n" "${tool}" "${active}"
            done
            melange version
            apko version
          '

      - name: Set up release-cli
        id: setup-cli
        uses: $/.github/actions/setup-release-cli

      - name: Verify canonical binary handoff
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_DIGEST: ${{ inputs.artifact-digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          "${RELEASE_CLI}" verify handoff --artifact-id "${ARTIFACT_ID}" --digest "${EXPECTED_DIGEST}"

      - name: Download canonical Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: oci-input
          digest-mismatch: error

      - name: Build the authoritative OCI layout
        id: build
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          RELEASE_INPUT: oci-input
          RELEASE_WORK: ${{ runner.temp }}/oci-build
          RELEASE_OUTPUT: ${{ github.workspace }}/oci-output
          RELEASE_MELANGE_CONFIG: ${{ inputs.melange-config }}
          RELEASE_APKO_CONFIG: ${{ inputs.apko-config }}
        shell: bash
        run: |
          set -euo pipefail
          # mise runs here without shims and without exporting PATH, so hand the
          # CLI the pinned melange and apko binaries instead of putting them on
          # PATH globally.
          melange_path="$(mise which melange)"
          if [ ! -x "${melange_path}" ]; then
            echo "::error::Resolved melange path ${melange_path} is not executable."
            exit 1
          fi
          apko_path="$(mise which apko)"
          if [ ! -x "${apko_path}" ]; then
            echo "::error::Resolved apko path ${apko_path} is not executable."
            exit 1
          fi

          # Reproducible timestamp: the committer date of the tagged commit.
          build_date="$(git show -s --format=%cI "${GITHUB_SHA}")"

          # The CLI stages the canonical binaries, builds the signed APK
          # repositories, and composes the locked multi-architecture layout.
          # Version, namespace, provenance, and the local reference come from
          # the Actions environment, so they are not passed as flags.
          envelope="$(
            RELEASE_MELANGE_PATH="${melange_path}" \
            RELEASE_APKO_PATH="${apko_path}" \
            RELEASE_BUILD_DATE="${build_date}" \
              "${RELEASE_CLI}" image build --json
          )"
          printf '%s\n' "${envelope}"

          work="$(jq -er '.result.work' <<<"${envelope}")"
          output="$(jq -er '.result.output' <<<"${envelope}")"
          version="$(jq -er '.result.version' <<<"${envelope}")"
          result_build_date="$(jq -er '.result.build_date' <<<"${envelope}")"

          {
            printf 'work=%s\n' "${work}"
            printf 'output=%s\n' "${output}"
            printf 'version=%s\n' "${version}"
            printf 'build-date=%s\n' "${result_build_date}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify authoritative OCI image
        id: verify
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          RELEASE_OUTPUT: ${{ steps.build.outputs.output }}
          RELEASE_WORK: ${{ steps.build.outputs.work }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # The CLI reads the layout byte for byte: the index, every platform
          # manifest and config, every staged binary inside the layer blob, and
          # the SPDX documents. Revision and source provenance come from the
          # Actions environment, so they are not passed as flags. The CLI also
          # writes image-digest.txt into the output root for the publisher.
          envelope="$("${RELEASE_CLI}" image verify --json)"
          printf '%s\n' "${envelope}"

          image_digest="$(jq -er '.result.index_digest' <<<"${envelope}")"
          printf 'image-digest=%s\n' "${image_digest}" >>"${GITHUB_OUTPUT}"

      - name: Upload authoritative OCI image
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-image
          path: oci-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

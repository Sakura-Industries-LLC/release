name: Reusable Go OCI Builder

on:
  workflow_call:
    inputs:
      artifact-id:
        description: ID of the canonical Linux binaries artifact.
        required: true
        type: string
      artifact-digest:
        description: Expected SHA-256 digest of the canonical Linux binaries artifact.
        required: true
        type: string
      melange-config:
        description: Path to the consumer's Melange package configuration.
        required: false
        default: melange.yaml
        type: string
      apko-config:
        description: Path to the consumer's apko image configuration.
        required: false
        default: apko.yaml
        type: string
      cli-path:
        description: >
          Unsupported path to a caller-supplied release-cli binary. You
          supply the binary, you own the pairing.
        required: false
        type: string
        default: ''

    outputs:
      artifact-id:
        description: ID of the authoritative OCI image artifact.
        value: ${{ jobs.oci-image.outputs.artifact-id }}
      artifact-url:
        description: URL of the authoritative OCI image artifact.
        value: ${{ jobs.oci-image.outputs.artifact-url }}
      artifact-digest:
        description: SHA-256 digest of the authoritative OCI image artifact.
        value: ${{ jobs.oci-image.outputs.artifact-digest }}
      image-digest:
        description: Digest of the OCI image index.
        value: ${{ jobs.oci-image.outputs.image-digest }}

permissions: {}

jobs:
  oci-image:
    name: Build authoritative OCI image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      image-digest: ${{ steps.verify.outputs.image-digest }}
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Require a tag ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (process.env.GITHUB_REF_TYPE !== 'tag') {
              throw new Error('Go OCI production must run against a tag ref.')
            }
            if (!process.env.GITHUB_REF_NAME.startsWith('v')) {
              throw new Error(`Expected a v-prefixed tag, got ${process.env.GITHUB_REF_NAME}.`)
            }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: >-
            aqua:cli/cli
            aqua:chainguard-dev/melange
            aqua:chainguard-dev/apko
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Verify OCI build tools
        shell: bash
        run: |
          mise exec -- bash -euo pipefail -c '
            for tool in gh melange apko; do
              active=$(command -v "${tool}")
              managed=$(mise which "${tool}")
              test "$(realpath "${active}")" = "$(realpath "${managed}")"
              printf "Using %s: %s\n" "${tool}" "${active}"
            done
            melange version
            apko version
          '

      - name: Download dogfood release-cli
        if: inputs.cli-path != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-cli-dogfood
          path: ${{ runner.temp }}/release-cli-dogfood

      - name: Place dogfood release-cli
        if: inputs.cli-path != ''
        env:
          CLI_PATH: ${{ inputs.cli-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${CLI_PATH}")"
          install -m755 "${RUNNER_TEMP}/release-cli-dogfood/release-cli" "${CLI_PATH}"

      - name: Set up release-cli
        id: setup-cli
        uses: $/.github/actions/setup-release-cli
        with:
          cli-path: ${{ inputs.cli-path }}

      - name: Verify canonical binary handoff
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_DIGEST: ${{ inputs.artifact-digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          "${RELEASE_CLI}" verify handoff --artifact-id "${ARTIFACT_ID}" --digest "${EXPECTED_DIGEST}"

      - name: Download canonical Linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: oci-input
          digest-mismatch: error

      - name: Build the authoritative OCI layout
        id: build
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          RELEASE_INPUT: oci-input
          RELEASE_WORK: ${{ runner.temp }}/oci-build
          RELEASE_OUTPUT: ${{ github.workspace }}/oci-output
          RELEASE_MELANGE_CONFIG: ${{ inputs.melange-config }}
          RELEASE_APKO_CONFIG: ${{ inputs.apko-config }}
        shell: bash
        run: |
          set -euo pipefail
          # mise runs here without shims and without exporting PATH, so hand the
          # CLI the pinned melange and apko binaries instead of putting them on
          # PATH globally.
          melange_path="$(mise which melange)"
          if [ ! -x "${melange_path}" ]; then
            echo "::error::Resolved melange path ${melange_path} is not executable."
            exit 1
          fi
          apko_path="$(mise which apko)"
          if [ ! -x "${apko_path}" ]; then
            echo "::error::Resolved apko path ${apko_path} is not executable."
            exit 1
          fi

          # Reproducible timestamp: the committer date of the tagged commit.
          build_date="$(git show -s --format=%cI "${GITHUB_SHA}")"

          # The CLI stages the canonical binaries, builds the signed APK
          # repositories, and composes the locked multi-architecture layout.
          # Version, namespace, provenance, and the local reference come from
          # the Actions environment, so they are not passed as flags.
          envelope="$(
            RELEASE_MELANGE_PATH="${melange_path}" \
            RELEASE_APKO_PATH="${apko_path}" \
            RELEASE_BUILD_DATE="${build_date}" \
              "${RELEASE_CLI}" image build --json
          )"
          printf '%s\n' "${envelope}"

          work="$(jq -er '.result.work' <<<"${envelope}")"
          output="$(jq -er '.result.output' <<<"${envelope}")"
          version="$(jq -er '.result.version' <<<"${envelope}")"
          result_build_date="$(jq -er '.result.build_date' <<<"${envelope}")"
          binary_name="$(jq -er '.result.binary' <<<"${envelope}")"

          {
            printf 'work=%s\n' "${work}"
            printf 'output=%s\n' "${output}"
            printf 'version=%s\n' "${version}"
            printf 'build-date=%s\n' "${result_build_date}"
            printf 'binary-name=%s\n' "${binary_name}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify authoritative OCI image
        id: verify
        env:
          OUTPUT: ${{ steps.build.outputs.output }}
          VERSION: ${{ steps.build.outputs.version }}
          BINARY_NAME: ${{ steps.build.outputs.binary-name }}
          WORK: ${{ steps.build.outputs.work }}
        shell: bash
        run: |
          set -euo pipefail
          cd "${OUTPUT}"
          jq -e \
            --arg description "$(jq -er '.annotations["org.opencontainers.image.description"]' layout/index.json)" \
            --arg license "$(jq -er '.annotations["org.opencontainers.image.licenses"]' layout/index.json)" \
            --arg revision "${GITHUB_SHA}" \
            --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg title "$(jq -er '.annotations["org.opencontainers.image.title"]' layout/index.json)" \
            --arg version "${VERSION}" '
              (.schemaVersion == 2) and
              (.mediaType == "application/vnd.oci.image.index.v1+json") and
              ((.manifests | length) == 2) and
              (([.manifests[].platform.architecture] | sort) == ["amd64", "arm64"]) and
              (all(.manifests[]; .platform.os == "linux")) and
              (.annotations["org.opencontainers.image.description"] == $description) and
              (.annotations["org.opencontainers.image.licenses"] == $license) and
              (.annotations["org.opencontainers.image.revision"] == $revision) and
              (.annotations["org.opencontainers.image.source"] == $source) and
              (.annotations["org.opencontainers.image.title"] == $title) and
              (.annotations["org.opencontainers.image.version"] == $version) and
              (($description | length) > 0) and
              (($license | length) > 0) and
              (($title | length) > 0)
            ' layout/index.json >/dev/null

          description=$(jq -er '.annotations["org.opencontainers.image.description"]' layout/index.json)
          license=$(jq -er '.annotations["org.opencontainers.image.licenses"]' layout/index.json)
          title=$(jq -er '.annotations["org.opencontainers.image.title"]' layout/index.json)

          while IFS=$'\t' read -r architecture manifest_digest; do
            case "${architecture}" in
              amd64) apkarch=x86_64 ;;
              arm64) apkarch=aarch64 ;;
              *) echo "::error::Unexpected architecture: ${architecture}"; exit 1 ;;
            esac
            manifest=layout/blobs/sha256/${manifest_digest#sha256:}
            jq -e \
              --arg description "${description}" \
              --arg license "${license}" \
              --arg revision "${GITHUB_SHA}" \
              --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --arg title "${title}" \
              --arg version "${VERSION}" '
                (.schemaVersion == 2) and
                (.mediaType == "application/vnd.oci.image.manifest.v1+json") and
                ((.layers | length) == 1) and
                (.annotations["org.opencontainers.image.description"] == $description) and
                (.annotations["org.opencontainers.image.licenses"] == $license) and
                (.annotations["org.opencontainers.image.revision"] == $revision) and
                (.annotations["org.opencontainers.image.source"] == $source) and
                (.annotations["org.opencontainers.image.title"] == $title) and
                (.annotations["org.opencontainers.image.version"] == $version)
              ' "${manifest}" >/dev/null
            config_digest=$(jq -er '.config.digest' "${manifest}")
            layer_digest=$(jq -er '.layers[0].digest' "${manifest}")
            config=layout/blobs/sha256/${config_digest#sha256:}
            layer=layout/blobs/sha256/${layer_digest#sha256:}
            entrypoint=/usr/bin/${BINARY_NAME}
            jq -e \
              --arg architecture "${architecture}" \
              --arg description "${description}" \
              --arg entrypoint "${entrypoint}" \
              --arg license "${license}" \
              --arg revision "${GITHUB_SHA}" \
              --arg source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --arg title "${title}" \
              --arg version "${VERSION}" '
                (.architecture == $architecture) and
                (.os == "linux") and
                (.config.Entrypoint == [$entrypoint]) and
                (.config.User == "65532") and
                (.config.Labels["org.opencontainers.image.description"] == $description) and
                (.config.Labels["org.opencontainers.image.licenses"] == $license) and
                (.config.Labels["org.opencontainers.image.revision"] == $revision) and
                (.config.Labels["org.opencontainers.image.source"] == $source) and
                (.config.Labels["org.opencontainers.image.title"] == $title) and
                (.config.Labels["org.opencontainers.image.version"] == $version)
              ' "${config}" >/dev/null
            entry=${entrypoint#/}

            listing=$(tar --numeric-owner -tvf "${layer}" "${entry}")
            read -r mode owner _ <<< "${listing}"
            if [[ "${mode}" != '-rwxr-xr-x' ]]; then
              echo "::error::${entrypoint} has mode ${mode}; expected -rwxr-xr-x (0755)."
              exit 1
            fi
            if [[ "${owner}" != '0/0' ]]; then
              echo "::error::${entrypoint} is owned by ${owner}; expected 0/0."
              exit 1
            fi
            expected=$(sha256sum "${WORK}/sources/${apkarch}/application" | cut -d' ' -f1)
            actual=$(tar -xOf "${layer}" "${entry}" | sha256sum | cut -d' ' -f1)
            if [[ "${actual}" != "${expected}" ]]; then
              echo "::error::${architecture} image binary differs from its canonical input."
              exit 1
            fi
          done < <(
            jq -r '.manifests[] | [.platform.architecture, .digest] | @tsv' layout/index.json
          )

          for sbom in sboms/sbom-x86_64.spdx.json sboms/sbom-aarch64.spdx.json; do
            jq -e --arg version "${VERSION}-r0" '
              any(.packages[];
                .primaryPackagePurpose == "APPLICATION" and
                .versionInfo == $version
              )
            ' "${sbom}" >/dev/null
          done

          image_digest=sha256:$(sha256sum layout/index.json | cut -d' ' -f1)
          printf '%s\n' "${image_digest}" > image-digest.txt
          echo "image-digest=${image_digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload authoritative OCI image
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-image
          path: oci-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

name: Reusable GitHub Release Publisher

on:
  workflow_call:
    inputs:
      artifact-id:
        description: ID of the authoritative release-assets artifact.
        required: true
        type: string
      artifact-digest:
        description: Expected SHA-256 digest of the release-assets artifact.
        required: true
        type: string
      checksum-signing-workflow-ref:
        description: Exact workflow ref expected in the checksum signing certificate identity.
        required: true
        type: string
      release-app-client-id:
        description: Client ID of the GitHub App that publishes releases.
        required: true
        type: string
      publish-release:
        description: Publish the draft after uploading and attesting its assets.
        required: false
        default: true
        type: boolean
      require-oci-image:
        description: Require a published digest-pinned OCI image before making the GitHub Release public.
        required: false
        default: false
        type: boolean
      oci-image-reference:
        description: Published digest-pinned OCI image reference; required for publication when require-oci-image is true.
        required: false
        default: ''
        type: string

    secrets:
      release-app-private-key:
        description: Private key of the GitHub App that publishes releases.
        required: true
    outputs:
      attestation-url:
        description: URL of the GitHub build-provenance attestation.
        value: ${{ jobs.publish.outputs.attestation-url }}
      release-url:
        description: URL of the populated GitHub Release.
        value: ${{ jobs.publish.outputs.release-url }}

permissions: {}

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      attestation-url: ${{ steps.attest.outputs.attestation-url }}
      release-url: ${{ steps.release.outputs.url }}
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    env:
      MISE_EXEC_AUTO_INSTALL: 'false'
    steps:
      - name: Require a tag ref
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OCI_IMAGE_REFERENCE: ${{ inputs.oci-image-reference }}
          PUBLISH_RELEASE: ${{ inputs.publish-release }}
          REQUIRE_OCI_IMAGE: ${{ inputs.require-oci-image }}
        with:
          script: |
            if (process.env.GITHUB_REF_TYPE !== 'tag') {
              throw new Error('GitHub Release publication must run against a tag ref.')
            }
            if (
              process.env.PUBLISH_RELEASE === 'true' &&
              process.env.REQUIRE_OCI_IMAGE === 'true'
            ) {
              const expectedName =
                `ghcr.io/${context.repo.owner.toLowerCase()}/${context.repo.repo.toLowerCase()}`
              const [name, digest, ...extra] =
                String(process.env.OCI_IMAGE_REFERENCE ?? '').split('@')
              if (
                name !== expectedName ||
                !/^sha256:[0-9a-f]{64}$/.test(digest) ||
                extra.length !== 0
              ) {
                throw new Error(
                  `GitHub Release publication requires a published OCI image at ${expectedName}@sha256:<digest>.`,
                )
              }
            }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: 'blob:none'
          persist-credentials: false

      # Fail before actions/attest writes a durable, unwithdrawable attestation.
      # The CLI repeats this binding authoritatively; this is the cheap gate.
      - name: Require the tag to point at this commit
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} resolves to ${tag_commit}, expected ${GITHUB_SHA}."
            exit 1
          fi

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.8
          install_args: 'aqua:cli/cli aqua:sigstore/cosign'
          cache: true
          add_shims_to_path: false
          export_path: false

      - name: Verify publication tools
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await exec.exec('mise', ['exec', '--', 'gh', '--version'])
            await exec.exec('mise', ['exec', '--', 'cosign', 'version'])

      - name: Create release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.release-app-client-id }}
          private-key: ${{ secrets.release-app-private-key }}
          permission-contents: write

      - name: Set up release-cli
        id: setup-cli
        uses: $/.github/actions/setup-release-cli

      - name: Verify artifact handoff
        env:
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
          ARTIFACT_ID: ${{ inputs.artifact-id }}
          EXPECTED_DIGEST: ${{ inputs.artifact-digest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          "${RELEASE_CLI}" verify handoff --artifact-id "${ARTIFACT_ID}" --digest "${EXPECTED_DIGEST}"

      - name: Download authoritative release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: dist
          digest-mismatch: error

      - name: Exclude package-manager controls from GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs/promises')
            const path = require('path')
            await fs.rm(path.resolve('dist/homebrew'), {recursive: true, force: true})
            await fs.rm(path.resolve('dist/scoop'), {recursive: true, force: true})

      - name: Verify authoritative release bundle
        id: bundle
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ inputs.checksum-signing-workflow-ref }}
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
        shell: bash
        run: |
          set -euo pipefail
          # mise runs here without shims and without exporting PATH, so hand the
          # CLI the pinned cosign binary instead of putting it on PATH globally.
          cosign_path="$(mise which cosign)"
          if [ ! -x "${cosign_path}" ]; then
            echo "::error::Resolved cosign path ${cosign_path} is not executable."
            exit 1
          fi

          RELEASE_COSIGN_PATH="${cosign_path}" \
            "${RELEASE_CLI}" verify bundle \
            --dist dist \
            --identity "${CERTIFICATE_IDENTITY}" \
            --json

      - name: Attest release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish verified GitHub Release
        id: release
        env:
          PUBLISH_RELEASE: ${{ inputs.publish-release }}
          RELEASE_APP_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_CLI: ${{ steps.setup-cli.outputs.cli-path }}
        shell: bash
        run: |
          set -euo pipefail
          # mise runs here without shims and without exporting PATH, so hand the
          # CLI the pinned gh binary instead of putting it on PATH globally.
          gh_path="$(mise which gh)"
          if [ ! -x "${gh_path}" ]; then
            echo "::error::Resolved gh path ${gh_path} is not executable."
            exit 1
          fi
          # git ships with the runner image; mise does not manage it.
          git_path="$(command -v git)"
          if [ ! -x "${git_path}" ]; then
            echo "::error::Resolved git path ${git_path} is not executable."
            exit 1
          fi

          # The CLI binds the tag to GITHUB_SHA, refuses unexpected assets,
          # converges the uploaded set, and only then leaves draft state.
          args=(
            publish github
            --dist dist
            --json
          )
          if [ "${PUBLISH_RELEASE}" != 'true' ]; then
            args+=(--no-undraft)
          fi

          envelope="$(
            RELEASE_GH_PATH="${gh_path}" \
            RELEASE_GIT_PATH="${git_path}" \
              "${RELEASE_CLI}" "${args[@]}"
          )"
          printf '%s\n' "${envelope}"

          url="$(jq -r '.result.url' <<<"${envelope}")"
          if [ -z "${url}" ] || [ "${url}" = 'null' ]; then
            echo '::error::Published GitHub Release reported no URL.'
            exit 1
          fi
          printf 'url=%s\n' "${url}" >>"${GITHUB_OUTPUT}"

package:
  name: example
  version: ${{vars.version}}
  epoch: 0
  description: Example Go command using the reusable release workflows.
  target-architecture:
    - x86_64
    - aarch64
  vendor: Example Organization
  homepage: https://github.com/OWNER/REPOSITORY
  maintainer: Release Team <releases@example.com>
  copyright:
    - license: Apache-2.0 OR MIT

vars:
  version: 0.0.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm755 -o 0 -g 0 application "${{targets.destdir}}/usr/bin/example"

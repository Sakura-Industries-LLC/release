# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: example

gomod:
  proxy: true
  env:
    - GOTOOLCHAIN=local
    - GOPROXY=https://proxy.golang.org,direct
    - GOSUMDB=sum.golang.org

builds:
  - id: example
    main: ./cmd/example
    binary: example
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: example
    ids:
      - example
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: example
    ids:
      - example
    vendor: Meigma
    homepage: https://github.com/meigma/release
    maintainer: Meigma <contact@meigma.dev>
    description: Example Go command using the Meigma release workflows.
    license: LicenseRef-Proprietary
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive
  - id: packages
    artifacts: package

signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  disable: true

release:
  disable: true

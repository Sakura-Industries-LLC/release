package:
  name: release-cli
  version: ${{vars.version}}
  epoch: 0
  description: Exercise the Meigma release pipeline.
  target-architecture:
    - x86_64
    - aarch64
  copyright:
    - license: Apache-2.0 OR MIT

vars:
  version: 0.0.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm755 -o 0 -g 0 release-cli "${{targets.destdir}}/usr/bin/release-cli"

[tools]
go = "1.26.6"
python = "3.14.7"
"aqua:golangci/golangci-lint" = "2.12.2"
"aqua:goreleaser/goreleaser" = "2.17.1"
"aqua:cli/cli" = "2.97.0"
"aqua:anchore/syft" = "1.51.0"
"aqua:astral-sh/uv" = "0.12.5"
"http:moon" = { version = "2.5.1", url = 'https://github.com/moonrepo/moon/releases/download/v{{ version }}/moon_cli-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os(linux="unknown-linux-musl", macos="apple-darwin") }}.tar.xz', checksum_url = 'https://github.com/moonrepo/moon/releases/download/v{{ version }}/moon_cli-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os(linux="unknown-linux-musl", macos="apple-darwin") }}.tar.xz.sha256' }
"aqua:chainguard-dev/melange" = "0.59.1"
"aqua:chainguard-dev/apko" = "1.2.37"
"aqua:sigstore/cosign" = "3.1.3"
"aqua:vektra/mockery" = "3.7.3"

[env]
GOTOOLCHAIN = "local"

[settings]
lockfile = true
locked = true

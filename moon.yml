language: 'go'
layer: 'application'
stack: 'backend'

project:
  title: 'release-cli'
  description: 'Exercise the Meigma release pipeline.'
  owner: 'meigma'
  maintainers:
    - 'meigma'

toolchains:
  default: 'system'

fileGroups:
  goSources:
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
    - 'go.mod'
    - 'go.sum'
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  ciConfig:
    - 'moon.yml'
    - '.github/workflows/**/*.yml'
  mockeryConfig:
    - '.mockery.yml'
    - 'mise.toml'
    - 'mise.lock'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'mise exec -- golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(ciConfig)'
    options:
      cache: false

  lint:
    command: 'mise exec -- golangci-lint run --config .golangci.yml ./... --show-stats=false'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(ciConfig)'
    options:
      cache: false

  build:
    command: 'mise exec -- go build -o bin/release-cli ./cmd/release-cli'
    inputs:
      - '@group(goSources)'
      - '@group(ciConfig)'
    outputs:
      - 'bin/release-cli'

  protocol:
    command: 'mise exec -- bash scripts/check-protocol-stamp.sh'
    inputs:
      - 'scripts/check-protocol-stamp.sh'
      - '.github/actions/setup-release-cli/action.yml'
      - '@group(goSources)'
    options:
      cache: false

  test:
    command: 'mise exec -- go test ./...'
    inputs:
      - '@group(goSources)'
      - '@group(ciConfig)'
    options:
      cache: false

  mocks:
    command: 'mise exec -- bash scripts/check-mocks.sh'
    inputs:
      - 'scripts/check-mocks.sh'
      - '@group(goSources)'
      - '@group(mockeryConfig)'
      - '@group(ciConfig)'
    options:
      cache: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'root:protocol'
      - 'root:mocks'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(ciConfig)'
    options:
      cache: false
      runInCI: true

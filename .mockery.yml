# Interfaces live in the consumer package (I2). Generated mocks live under
# the implementing adapter's mocks/ package (T3), not next to the interface.
# Add an interface here only when its implementation slice lands.
all: false
dir: '{{.InterfaceDir}}'
filename: '{{ .InterfaceName | snakecase }}.go'
force-file-write: true
formatter: goimports
formatter-options:
  goimports:
    local-prefix: github.com/meigma/release
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: mocks
recursive: false
template: testify
packages:
  github.com/meigma/release/internal/stage/pubbrew:
    config:
      dir: internal/adapter/ghtap/mocks
    interfaces:
      RepositoryReader:
        config:
          filename: repository_reader.go
      RepositoryWriter:
        config:
          filename: repository_writer.go
  github.com/meigma/release/internal/stage/pubgh:
    config:
      dir: internal/adapter/ghact/mocks
    interfaces:
      ArtifactMeta:
        config:
          filename: artifact_meta.go
      BlobVerifier:
        config:
          dir: internal/adapter/cosign/mocks
          filename: blob_verifier.go
      ReleaseReader:
        config:
          dir: internal/adapter/ghrel/mocks
          filename: release_reader.go
      Publisher:
        config:
          dir: internal/adapter/ghrel/mocks
          filename: publisher.go
      AssetReplacer:
        config:
          dir: internal/adapter/ghup/mocks
          filename: asset_replacer.go
      RefResolver:
        config:
          dir: internal/adapter/gitx/mocks
          filename: ref_resolver.go
  github.com/meigma/release/internal/stage/puboci:
    config:
      dir: internal/adapter/reg/mocks
    interfaces:
      StateReader:
        config:
          filename: state_reader.go
      ContentPusher:
        config:
          filename: content_pusher.go
      Signer:
        config:
          dir: internal/adapter/cosign/mocks
          filename: signer.go
      TagCommitter:
        config:
          filename: tag_committer.go
  github.com/meigma/release/internal/stage/image:
    interfaces:
      APKBuilder:
        config:
          dir: internal/adapter/melange/mocks
          filename: apk_builder.go
      Composer:
        config:
          dir: internal/adapter/apko/mocks
          filename: composer.go
